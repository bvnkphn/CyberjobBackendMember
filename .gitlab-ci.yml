stages: [verify, package]
verify:
  stage: verify
  image: node:22-alpine
  script: ["npm ci --cache .npm --prefer-offline", "npm run build"]
docker:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  variables: { DOCKER_TLS_CERTDIR: "/certs" }
  script: ["docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY", "docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .", "docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
