services:
  api:
    build: .
    env_file: .env
    ports: ["3003:3003"]
    depends_on: { postgres: { condition: service_healthy } }
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: cyberjob, POSTGRES_PASSWORD: change-me, POSTGRES_DB: cyberjob_member }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cyberjob -d cyberjob_member"], interval: 5s, timeout: 5s, retries: 10 }
volumes: { postgres_data: {} }
